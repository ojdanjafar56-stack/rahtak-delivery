
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>راحتك | RAHTAK DELIVERY</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }
    header { padding: 35px 15px 20px; }
    .logo { font-size: 34px; font-weight: bold; }
    .logo span { color: #b7f531; }
    .slogan { color: #ccc; margin-top: 12px; }
    main { padding: 15px; }
    .card {
      background: #202020;
      border-radius: 18px;
      padding: 22px 16px;
      margin: 15px auto;
      max-width: 420px;
    }
    h2 { color: #b7f531; }
    p { line-height: 1.8; }
    button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: #b7f531;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      padding: 15px;
      margin-top: 12px;
    }
    .secondary {
      background: transparent;
      color: #b7f531;
      border: 1px solid #b7f531;
    }
    footer { padding: 25px 10px; color: #aaa; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">راحتك <span>| RAHTAK</span></div>
    <div class="slogan">إنت ارتاح.. وإحنا نوصّل.</div>
  </header>
  <main>
    <section class="card">
      <h2>أهلاً بك في راحتك</h2>
      <p>خدمة توصيل الطلبات إلى باب بيتك بكل سهولة.</p>
      <button onclick="alert('سيتم تجهيز خدمة الطلب قريباً')">اطلب توصيل الآن</button>
      <button class="secondary" onclick="alert('سيتم تجهيز متابعة الطلبات قريباً')">متابعة طلبي</button>
    </section>
    <section class="card">
      <h2>خدماتنا</h2>
      <p>🛍️ توصيل المشتريات</p>
      <p>🍔 توصيل الطعام</p>
      <p>📦 توصيل الطلبات</p>
    </section>
  </main>
  <footer>RAHTAK DELIVERY © 2026</footer>
</body>
</html>
